project:
  type: book
  output-dir: _book
bibliography: references.bib
book:
  title: The Embedding Revolution
  subtitle: Navigating High-Dimensional Knowledge Manifolds Through the Geek's Lens
  author: Marc Magrans de Abril
  date: '2026'
  description: A comprehensive guide to high-dimensional embedding spaces, geometry,
    and neurosymbolic computing.
  page-footer:
    left: The Embedding Revolution
    right: Marc Magrans de Abril
  chapters:
  - index.qmd
  - part: The Flat Vector Paradigm and Its Limits
    chapters:
    - chapters/embedding_spaces.qmd
format:
  html:
    theme:
      light:
      - cosmo
      - styles/book-theme.scss
      dark:
      - darkly
      - styles/book-theme.scss
    toc: true
    toc-depth: 3
    number-sections: true
    code-fold: show
    code-tools: true
    html-math-method: mathjax
    filters:
    - filters/book-callouts.lua
    - filters/book-typography.lua
  pdf:
    output-file: The-Embedding-Revolution.pdf
    documentclass: scrbook
    classoption:
    - openany
    - twoside=true
    - fontsize=10pt
    geometry:
    - paperwidth=7in
    - paperheight=9.1875in
    - top=0.8in
    - bottom=0.85in
    - inner=0.85in
    - outer=0.75in
    - headheight=14pt
    - headsep=0.25in
    - footskip=0.35in
    pdf-engine: xelatex
    toc: true
    toc-depth: 3
    number-sections: true
    number-depth: 3
    colorlinks: true
    linkcolor: DarkRed
    urlcolor: DarkRed
    citecolor: DarkRed
    include-in-header:
    - styles/oreilly-preamble.tex
    filters:
    - filters/book-callouts.lua
    - filters/book-typography.lua
  epub:
    output-file: The-Embedding-Revolution.epub
    toc: true
    toc-depth: 2
    number-sections: true
    css:
    - styles/epub.css
    filters:
    - filters/book-callouts.lua
    - filters/book-typography.lua
