  - id: G-epilogue
    title: Where the Epilogue goes
    decides: [TE]
    question: "Which of its sections supply concepts the chapters use (prior), and which re-read results the chapters produced (posterior)?"
    options:
      - {id: end, text: "Keep it last, as the book read again through other traditions."}
      - {id: split, text: "Concept-supplying sections (meaning of meaning, the perfect language, difference and company, measuring meaning before computers, where psychology said no) move before or between the parts as interludes. Re-readings (ledger revisited, bitter lesson, dog test revisited, open frontiers) stay last."}
      - {id: woven, text: "Each tradition becomes a closing section in the chapter where it bears; only the open frontiers remain at the end."}
      - {id: apart, text: "Publish it as a companion; the book ends where its readings end."}
    criteria: "Per section: does any chapter use its vocabulary or a source it introduces (prior), or does it depend on a reading a chapter produced (posterior)? Shared citekeys and cross-references between the Epilogue and the chapters give a first count."
    evidence_needed: [C5.scale, C8.scale]
    opens_when: "Parts I and II have readings, so the posterior sections can be judged. The prior sections can be decided earlier."
