  - id: G-argument
    title: Whether the book has an argument
    decides: [B1, T0]
    question: "Do the committed readings point the same way, or is the book a catalogue of what each structure buys and costs?"
    options:
      - {id: thesis, text: "A claim has emerged. State it, and rewrite the Prologue around it."}
      - {id: catalogue, text: "No single claim. The book says so and presents the readings, their evidence and their costs."}
      - {id: two-stories, text: "The evidence supports two different stories; keep both as separate threads or pick one."}
    criteria: "A thesis exists only if two or more independent readings of medium confidence or better point the same way and no committed reading contradicts them."
    evidence_needed: [B2, B3, B4]
