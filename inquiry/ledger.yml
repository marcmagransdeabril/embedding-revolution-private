# Inquiry ledger of The Embedding Revolution
#
# The book is an exploration. Its chapters are built around QUESTIONS, which are stable.
# Everything the book currently believes about them is a READING, which is revisable and dated.
# This file is the only place that holds readings together with the evidence behind them.
# The prose (Prologue, roadmap, stubs, "Next:" lines) states plans and hypotheses; when it and
# this ledger disagree about substance, the ledger and the evidence outrank the plan.
#
# Who edits it: the author. The review-doc skill (§17) proposes entries and changes as a diff
# and applies them only on approval. `make validate-inquiry` lints the file.
#
# Entry fields
#   id               B* book, C<n>.* chapter, S<n>.* section (any unique string)
#   level            book | chapter | section
#   question         the question, stated so that either outcome is a result
#   where            files or anchors where the question or its reading is stated in the text
#   reading          current best answer in one sentence; null = no commitment yet
#   status           open       asked; any reading is an untested hypothesis
#                    leaning    some evidence, not enough to rely on
#                    supported  evidence carries it, with its caveats
#                    contested  credible evidence on both sides
#                    revised    the reading changed (needs a log entry)
#                    dropped    no longer asked (needs a log entry)
#   confidence       none | low | medium | high, capped by the kind of evidence:
#                    medium needs one solid source (theorem, historical, replicated, own-experiment);
#                    high needs a theorem or two solid sources, and an 'answered_against' note if
#                    any evidence against exists. single-study, position, interpretive: low at most.
#   evidence         for / against lists of {src, loc, kind, note}
#                    src = citekey in references.bib, or a repo path (code/..., data)
#                    kind = theorem | historical | replicated | own-experiment | single-study |
#                           position | interpretive
#   open_set         true when the answer is a LIST THAT KEEPS GROWING (members are tree nodes);
#                    then 'members' and 'last_search' (when new members were last looked for) are required
#                    and the set is never 'supported' as complete
#   falsifier        the observation that would change the reading (required once not 'open')
#   depends_on       ids of readings this one rolls up; confidence cannot exceed the weakest
#   searched_against date counter-evidence was last actively searched for, or null
#   checked          date the entry was last compared with the evidence
#
# The tree and the gates (below the questions) track the book's SHAPE the same way:
#   tree    every part, chapter, section and idea that was or is on the table, with how much the
#           author stands behind its existence (commitment) and how far its content got (content).
#             commitment: settled | provisional | exploratory | parked | dropped
#               settled      it should exist; I am confident (the content may still be a stub)
#               provisional  it probably exists; the shape or the need is not obvious
#               exploratory  terra incognita; it exists as a question, not as a decision
#               parked       not now; 'reopen_if' says what brings it back
#               dropped      explored and left; 'why' records what was learned so it is not redone
#             content:    none | stub | outline | draft | written
#   gates   decision points for the exploratory nodes. A gate says which question to ask on arrival,
#           which options exist, how the evidence decides between them, and which readings it waits
#           for ('evidence_needed'; the lint reports "decision due" when all of them have a reading).
#           Nothing is decided by the reviewer: a gate is decided by the author, with the reason.
#
# The log records changes of direction: what moved, and because of which evidence.
# A surprise is a good entry. A reading that moved without a log entry is a finding.

schema: 1

# Files that are partly scratchpad. Text before the heading is definitive; the rest is plan.
# Durability metrics are reported for the definitive part separately. Update as chapters are written.
definitive:
  chapters/embedding_spaces.qmd: "## Learning by Contrast"

questions:
  # ---- Book level (questions stated in index.qmd; readings are the working hypotheses there)
  - id: B1
    level: book
    question: >
      Is representing meaning as vectors a good approach: why does it work, what can it
      express, where does it strain, and what does each proposed extension buy and cost?
    where: [index.qmd#the-thesis-of-this-book]
    reading: "Working hypothesis (Prologue): representing meaning as vectors is a good approach."
    status: open
    confidence: none
    evidence: {for: [], against: []}
    falsifier: >
      A task class where the best vector-based method loses to a non-vector method at matched
      compute and the gap persists as compute grows; or a structural limit (Chapter 4) that
      binds in practice and is not removed by scale.
    depends_on: [C3.rice, C4.scale, C5.scale, C6.scale, C7.scale, C8.scale, C9.scale,
                 C10.scale, C11.scale, C12.scale, C13.scale]
    searched_against: null
    checked: 2026-11-10

  - id: B2
    level: book
    question: >
      For each structure added to a vector space (symmetry, curvature, relations, topology,
      logic, composition), does scale make it unnecessary, does it survive because it is cheap,
      or because the problem demands it? (the bitter lesson test)
    where: [index.qmd#book-architecture-master-roadmap]
    reading: null
    status: open
    confidence: none
    evidence: {for: [], against: []}
    falsifier: null
    depends_on: [C4.scale, C5.scale, C6.scale, C7.scale, C8.scale, C9.scale, C10.scale,
                 C11.scale, C12.scale, C13.scale]
    searched_against: null
    checked: 2026-11-10

  - id: B3
    level: book
    question: >
      Dog test: are a photograph, a word, a bark and a gait placed in one space one meaning seen
      through four channels, or four meanings that happen to be close?
    where: [index.qmd#the-dog-test]
    reading: null
    status: open
    confidence: none
    evidence: {for: [], against: []}
    falsifier: null
    depends_on: [C13.scale]
    searched_against: null
    checked: 2026-11-10

  - id: B4
    level: book
    question: >
      Can reasoning stay in the space instead of passing through text, and if it can, is a path
      in the space any more reliable than a chain written in words?
    where: [index.qmd#why-everything-is-becoming-a-vector, chapters/properties_of_meaning.qmd#sec-prop-paths]
    reading: null
    status: open
    confidence: none
    evidence: {for: [], against: []}
    falsifier: null
    depends_on: []
    searched_against: null
    checked: 2026-11-10

  - id: B0
    level: book
    question: >
      What does "revolution" name here? The title and the Prologue use it as a metaphor, and
      what it refers to has not been decided.
    where: [index.qmd#prologue-the-geometry-of-meaning, README.md]
    candidates:
      - id: representation
        text: "A change in how knowledge is represented: from symbols and records to positions in a space (Shannon set meaning aside; vectors take it back)."
        test: "Name what it displaced and the anomalies that forced the change. Without a failing predecessor it is a change of tool, not a revolution."
      - id: method
        text: "One method now reaches everything (text, images, proteins, graphs, trajectories) and the embedding is what they share."
        test: "Is the shared part the embedding, or only deep learning plus scale? If the latter, the revolution is learning and the embedding is a consequence."
      - id: epistemic
        text: "Reasoning and knowledge become paths in a space, draws from a distribution of paths, instead of derivations that guarantee an answer."
        test: "The readings of B4 (reasoning in the space or in text) and of Chapters 5 and 13."
      - id: metaphor
        text: "Only a title. The exploration stands without a revolution claim."
        test: "After Part II, does any committed reading support 'revolution' rather than 'a useful representation'? If not, this candidate wins by default."
    reading: null
    status: open
    confidence: none
    evidence: {for: [], against: []}
    falsifier: null
    depends_on: [B1, B2, B3, B4]
    searched_against: null
    checked: 2026-11-10

  - id: C1.props
    level: chapter
    question: >
      Which properties does meaning acquire once it is a position in a space? The list is not
      closed: it grows and changes as the field does, and some members are known to experts
      the author has not yet met.
    where: [chapters/properties_of_meaning.qmd, index.qmd#book-architecture-master-roadmap]
    open_set: true
    members: [T1.nearness, T1.difference, T1.direction, T1.region, T1.paths, T1.combine, T1.senses, T1.arrangement, T1.invariance]
    last_search: null
    how_to_find: >
      Ask a reader in cognitive science of concepts and one in interpretability what is missing.
      Search for surveys of the geometry of representations and of word and sentence embeddings.
      For each later chapter, ask what it needs from a space that no property yet promises.
      A property earns its place by naming a thing a space can do or must survive, pointing to a
      chapter that tests it, and having a source that is not the author.
    reading: "Working list of nine (the sections of Chapter 1). Not claimed to be complete or minimal."
    status: leaning
    confidence: low
    evidence:
      for: [{src: gardenfors2000conceptual, kind: interpretive, note: "a quality-dimension account of meaning; one expert list among others"}]
      against: []
    falsifier: "A property that a later chapter needs and that none of the nine states, or two of the nine that turn out to be one."
    depends_on: []
    searched_against: null
    checked: 2026-11-10

  - id: C3.limits
    level: chapter
    question: Which limits of a single vector does Chapter 3 end with, stated as costs rather than impossibilities?
    where: [chapters/embedding_spaces.qmd#where-a-single-vector-strains, index.qmd#book-architecture-master-roadmap]
    reading: null
    status: open
    confidence: none
    evidence: {for: [], against: []}
    falsifier: null
    depends_on: []
    searched_against: null
    checked: 2026-11-10

  # ---- Chapter 3, written part: one entry as a worked example of a filled reading
  - id: C3.rice
    level: chapter
    question: Can exact meaning be computed, or must similarity of meaning be graded?
    where: [chapters/embedding_spaces.qmd#rices-theorem-why-exact-meaning-is-out-of-reach]
    reading: >
      No program decides non-trivial properties of what another program means, so a system
      that handles meaning at scale has to settle for graded, approximate similarity.
    status: supported
    confidence: medium
    evidence:
      for:
        - {src: rice1953classes, kind: theorem, note: "the theorem covers programs; the step to natural-language meaning is the book's inference"}
        - {src: code/embedding_spaces/rice_semidecider.py, kind: own-experiment}
      against: []
    falsifier: >
      A formalization of meaning for which an exact, total, decidable test exists and covers
      the uses the book cares about (so the reduction to program semantics fails).
    depends_on: []
    searched_against: null
    checked: 2026-11-10

