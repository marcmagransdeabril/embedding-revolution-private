gates:
  - id: G-props
    title: Which properties are on the list
    decides: [C1.props, T1]
    recurring: true
    question: "Since the last review: has a property been found, merged, split or dropped, and does every later chapter's need appear in the list?"
    options:
      - {id: add, text: "Add a property: name it, point to the chapter that tests it, give a source that is not the author."}
      - {id: merge, text: "Two properties are one; merge them and keep the anchors that exist."}
      - {id: split, text: "One property hides two; split it."}
      - {id: drop, text: "A property no chapter tests and no source supports; move it to the tree as dropped, with why."}
      - {id: keep, text: "No change."}
    criteria: "Run at each chapter arrival (what does this chapter need from a space?) and after each expert or literature pass."
    evidence_needed: []
    opens_when: "Always open. Reviewed whenever a chapter is started or finished."
    status: recurring
    last_reviewed: 2026-11-10
    decision: null
    decided_on: null
    because: null
    revisit_if: null

  - id: G-rev
    title: What the "revolution" is
    decides: [B0, T0]
    question: "Which candidate of B0 does the evidence support, and should the title, the Prologue and the roadmap keep the word?"
    options:
      - {id: keep-as-claim, text: "One candidate (representation, method or epistemic) is supported: state it in the Prologue and make the book answer to it."}
      - {id: keep-as-metaphor, text: "Keep the title as an openly labelled metaphor; the Prologue says what it is a metaphor for."}
      - {id: drop-word, text: "Retitle; the book is an exploration of vectors as meaning."}
    criteria: "A claim needs a named predecessor that failed (representation) or a shared component that is not just scale (method). If neither is found by the end of Part II, choose drop-word or keep-as-metaphor."
    evidence_needed: [B2, B3]
    opens_when: "After the scale-test readings of Part II exist; may be decided earlier as provisional."
    status: pending
    decision: null
    decided_on: null
    because: null
    revisit_if: "A later part produces a reading that supports a candidate that lost."

  - id: G-ch2
    title: Where Chapter 2 belongs
    decides: [T2]
    question: "Does Chapter 2 stand alone, or does its material belong somewhere it is used?"
    options:
      - {id: keep, text: "Keep it as Chapter 2, as in the roadmap."}
      - {id: merge-into-3, text: "Fold concentration, near-orthogonality and the manifold hypothesis into Chapter 3 (which already has the Orthogonal Catastrophe) and remove the chapter."}
      - {id: just-in-time, text: "Split: the curse (distance concentration) goes before Chapter 4 where retrieval needs it, the blessing (room for many directions) before Chapter 10 where VSAs use it."}
      - {id: fold-into-1, text: "Reduce it to the promise in Chapter 1 and place each result where a chapter earns it."}
    criteria: "Count how many later chapters rely on a result proved in Chapter 2 and how much of it Chapter 3 repeats. Many reliers and little overlap favours keep; few reliers favours merge-into-3; reliers in two distant places favours just-in-time."
    evidence_needed: [C3.limits]
    opens_when: "Chapter 3 ends with its ledger of limits, so overlap and reliance can be counted."
    status: pending
    decision: null
    decided_on: null
    because: null
    revisit_if: null

  - id: G-P1
    title: Whether Chapters 4 and 5 belong to Part I
    decides: [T4, T5, P1]
    question: "Given the limits Chapter 3 ends with, are retrieval and contextual vectors the next questions, and are they still about why meaning as vectors works?"
    options:
      - {id: continue, text: "Write Chapters 4 and 5 as planned."}
      - {id: reshape, text: "Keep the questions, change the order or merge them (the same dot product runs in both)."}
      - {id: move-to-part-II-or-later, text: "They are uses of vectors, not reasons they work; they move to a later part and Part I ends at Chapter 3."}
      - {id: drop, text: "Drop one or both; record why."}
    criteria: "Each limit of C3.limits must be taken up by some chapter. A chapter that no limit leads to has no question yet."
    evidence_needed: [C3.limits]
    opens_when: "Chapter 3's ledger of limits has a reading."
    status: pending
    decision: null
    decided_on: null
    because: null
    revisit_if: null

  - id: G-P2
    title: Whether structure by design is still worth a part
    decides: [P2, T6, T7, T8]
    question: "Do transformers find the structures of Chapters 6 to 8 without being told? If they do, which of these chapters survive?"
