format:
  pdf:
    output-file: "The-Embedding-Revolution-Springer.pdf"
    documentclass: scrbook
    classoption: ["openany", "twoside=true", "fontsize=10pt"]
    geometry:
      - paperwidth=155mm
      - paperheight=235mm
      - top=24mm
      - bottom=26mm
      - inner=22mm
      - outer=20mm
      - headheight=14pt
      - headsep=6mm
      - footskip=12mm
    pdf-engine: xelatex
    toc: true
    toc-depth: 3
    number-sections: true
    number-depth: 3
    colorlinks: true
    linkcolor: "NavyBlue"
    urlcolor: "NavyBlue"
    citecolor: "NavyBlue"
    include-in-header:
      - styles/springer-preamble.tex
    filters:
      - filters/book-callouts.lua
      - filters/book-typography.lua
