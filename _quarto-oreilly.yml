format:
  pdf:
    output-file: "The-Embedding-Revolution-OReilly.pdf"
    documentclass: scrbook
    classoption: ["openany", "twoside=true", "fontsize=10pt"]
    geometry:
      - paperwidth=7in
      - paperheight=9.1875in
      - top=0.8in
      - bottom=0.85in
      - inner=0.85in
      - outer=0.75in
      - headheight=14pt
      - headsep=0.25in
      - footskip=0.35in
    pdf-engine: xelatex
    toc: true
    toc-depth: 3
    number-sections: true
    number-depth: 3
    colorlinks: true
    linkcolor: "DarkRed"
    urlcolor: "DarkRed"
    citecolor: "DarkRed"
    include-in-header:
      - styles/oreilly-preamble.tex
    filters:
      - filters/book-callouts.lua
      - filters/book-typography.lua
